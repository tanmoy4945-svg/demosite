<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Desktop view on mobile constraint -->
    <meta name="viewport" content="width=1200">
    <title>BeautyFly | Premium Beauty Salon</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ec4899',
                        secondary: '#fdf2f8',
                        accent: '#71717a',
                        dark: '#18181b',
                        whatsapp: '#22c55e'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .glass-header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #fdf2f8;
        }
        
        /* Stronger Hero Overlay for Readability */
        .hero-overlay {
            background: linear-gradient(to right, rgba(255, 255, 255, 0.9) 20%, rgba(255, 255, 255, 0.3) 100%);
        }

        .service-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(236, 72, 153, 0.1);
            border-color: #ec4899;
        }

        .nav-link {
            color: #27272a !important;
            font-weight: 600;
            transition: all 0.3s;
        }
        .nav-link:hover { color: #ec4899 !important; }

        .admin-sidebar-active {
            border-left: 4px solid #ec4899;
            background: #fdf2f8;
            color: #ec4899;
        }

        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-bg { background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
    </style>
</head>
<body class="font-sans text-zinc-800 bg-white">

    <div id="app"></div>

    <script>
        // --- DATA STORE ---
        const DEFAULT_DATA = {
            config: {
                name: "BeautyFly",
                logo: "BeautyFly",
                whatsapp: "9183709 68140",
                phone: "+91 83709 68140",
                address: "Rabindranagar Old LIC MORE, West, near LIFE THREE, Rabindra Nagar, Midnapore, West Bengal 721101",
                googleProfile: "https://google.com/maps/place/https://share.google/ZrH7jnsDA75gaPlTJ", // এখানে আপনার লিংক দিন
                mapEmbed: "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3691.311746685826!2d87.32402127532688!3d22.400344479619183!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3a1d40fc20625907%3A0xc3f0b2f90656a81b!2sRabindra%20Nagar%2C%20Midnapore%2C%20West%20Bengal%20721101!5e0!3m2!1sen!2sin!4v1715423456789!5m2!1sen!2sin",
                
            },
            hero: {
                title: "Experience Luxury Beauty Care",
                subtitle: "Professional salon services designed for your beauty. Step into a world of elegance and relaxation.",
                image: "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&q=80&w=1920",
                btn1: "Book Appointment",
                btn2: "WhatsApp Consultation"
            },
            about: {
                title: "Where Beauty Meets Perfection",
                content: "Serene Aura is a premium beauty destination offering world-class treatments. Our mission is to provide an unforgettable experience through customized care and the highest quality products.",
                image: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?auto=format&fit=crop&q=80&w=800",
                stats: [
                    { label: "Happy Clients", value: "5000+" },
                    { label: "Years Experience", value: "10+" },
                    { label: "Expert Stylists", value: "15+" }
                ]
            },
            services: [
                { id: 1, name: "Hair Styling", price: "₹1,200", desc: "Expert cuts and styling for all hair types.", icon: "fa-scissors" },
                { id: 2, name: "Facial Treatment", price: "₹2,500", desc: "Deep cleansing and glowing skin therapy.", icon: "fa-spa" },
                { id: 3, name: "Bridal Makeup", price: "₹15,000", desc: "Look stunning on your special day.", icon: "fa-heart" },
                { id: 4, name: "Hair Spa", price: "₹1,800", desc: "Nourishing treatment for healthy hair.", icon: "fa-wind" }
            ],
            whyChooseUs: [
                { title: "Experienced Beauticians", desc: "Our team consists of industry veterans.", icon: "fa-user-tie" },
                { title: "Premium Products", desc: "We use only the world's best beauty brands.", icon: "fa-crown" },
                { title: "Clean Environment", desc: "Strict hygiene and sanitized equipment.", icon: "fa-hand-sparkles" }
            ],
            gallery: [
                "https://images.unsplash.com/photo-1522337660859-02fbefca4702?auto=format&fit=crop&q=80&w=600",
                "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?auto=format&fit=crop&q=80&w=600",
                "https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&q=80&w=600",
                "https://images.unsplash.com/photo-1595476108010-b4d1f8c2b1b1?auto=format&fit=crop&q=80&w=600"
            ],

          reviews: [
                { name: "Ananya Sharma", stars: 5, comment: "Absolutely loved the bridal makeup. Highly professional team!", avatar: "AS" },
                { name: "Priya Patel", stars: 4, comment: "Great service and very relaxing environment. The hair spa is a must-try.", avatar: "PP" },
                { name: "Sonia Khan", stars: 5, comment: "The best facial I have ever had. Glowing results!", avatar: "SK" }
            ],
            openHours: {
                weekdays: "10:00 AM – 8:00 PM",
                saturday: "09:00 AM – 9:00 PM",
                sunday: "10:00 AM – 6:00 PM"
            },
            sections: []
        };

        let state = JSON.parse(localStorage.getItem('beauty_pro_db')) || DEFAULT_DATA;
        let isAdmin = false;
        let activeAdminTab = 'dashboard';
        let reviewsToShow = 2;

        function saveData() {
            localStorage.setItem('beauty_pro_db', JSON.stringify(state));
        }

        // --- COMPONENTS ---
        const Header = () => `
            <header class="fixed top-0 left-0 w-full z-50 glass-header px-10 py-5 flex items-center justify-between shadow-sm">
                <div class="text-2xl font-serif font-bold tracking-tight text-primary">${state.config.logo}</div>
                <nav class="flex items-center gap-10">
                    <a href="#about" class="nav-link text-sm uppercase tracking-widest">About</a>
                    <a href="#services" class="nav-link text-sm uppercase tracking-widest">Services</a>
                    <a href="#gallery" class="nav-link text-sm uppercase tracking-widest">Gallery</a>
                    <a href="#reviews" class="nav-link text-sm uppercase tracking-widest">Reviews</a>
                    <a href="#contact" class="nav-link text-sm uppercase tracking-widest">Contact</a>
                </nav>
                <div class="flex items-center gap-4">
                    <a href="https://wa.me/${state.config.whatsapp}" class="bg-whatsapp text-white px-5 py-2 rounded-full font-bold flex items-center gap-2 hover:scale-105 transition-transform shadow-md">
                        <i class="fab fa-whatsapp text-lg"></i> Book Now
                    </a>
                    <button onclick="toggleAdminLogin()" class="w-10 h-10 flex items-center justify-center rounded-full bg-zinc-100 text-zinc-600 hover:text-primary transition-all">
                        <i class="fa fa-user-shield"></i>
                    </button>
                </div>
            </header>
        `;

        const Hero = () => `
            <section class="relative min-h-screen flex items-center px-20">
                <div class="absolute inset-0 z-0">
                    <img src="${state.hero.image}" class="w-full h-full object-cover" />
                    <div class="absolute inset-0 hero-overlay"></div>
                </div>
                <div class="relative z-10 max-w-2xl fade-in">
                    <h1 class="text-7xl font-serif text-dark mb-6 leading-tight drop-shadow-sm">${state.hero.title}</h1>
                    <p class="text-xl text-zinc-700 mb-10 leading-relaxed font-medium">${state.hero.subtitle}</p>
                    <div class="flex gap-4">
                        <button class="bg-primary text-white px-10 py-4 rounded-full font-bold text-lg hover:bg-pink-600 transition-all shadow-xl shadow-pink-200">${state.hero.btn1}</button>
                        <a href="https://wa.me/${state.config.whatsapp}" class="bg-whatsapp text-white px-10 py-4 rounded-full font-bold text-lg hover:bg-green-600 transition-all shadow-xl shadow-green-100">${state.hero.btn2}</a>
                    </div>
                </div>
            </section>
        `;

        const About = () => `
            <section id="about" class="py-24 px-20 bg-white">
                <div class="grid grid-cols-2 gap-16 items-center max-w-7xl mx-auto">
                    <div>
                        <span class="text-primary font-bold uppercase tracking-widest text-sm mb-4 block">Our Story</span>
                        <h2 class="text-5xl font-serif text-dark mb-6">${state.about.title}</h2>
                        <p class="text-zinc-600 text-lg leading-relaxed mb-10">${state.about.content}</p>
                        <div class="grid grid-cols-3 gap-8">
                            ${state.about.stats.map(s => `
                                <div>
                                    <div class="text-4xl font-serif text-primary font-bold">${s.value}</div>
                                    <div class="text-xs text-zinc-500 uppercase font-bold tracking-wide">${s.label}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="relative">
                        <img src="${state.about.image}" class="rounded-3xl shadow-2xl w-full h-[500px] object-cover" />
                    </div>
                </div>
            </section>
        `;

        const Services = () => `
            <section id="services" class="py-24 px-20 bg-secondary/50">
                <div class="max-w-7xl mx-auto">
                    <div class="text-center mb-16">
                        <h2 class="text-5xl font-serif text-dark mb-4">Our Services</h2>
                        <p class="text-zinc-500 max-w-xl mx-auto">Choose from our wide range of premium beauty treatments.</p>
                    </div>
                    <div class="grid grid-cols-4 gap-8">
                        ${state.services.map(s => `
                            <div class="service-card bg-white p-8 rounded-3xl border border-pink-50 transition-all">
                                <div class="w-16 h-16 bg-pink-50 rounded-2xl flex items-center justify-center mb-6">
                                    <i class="fa ${s.icon} text-primary text-2xl"></i>
                                </div>
                                <h3 class="text-xl font-bold text-dark mb-2">${s.name}</h3>
                                <p class="text-primary font-bold text-xl mb-4">${s.price}</p>
                                <p class="text-zinc-500 text-sm leading-relaxed mb-6">${s.desc}</p>
                                <a href="https://wa.me/${state.config.whatsapp}?text=Hi, I want to book ${s.name} service." class="block text-center py-3 bg-zinc-900 text-white rounded-xl font-bold text-xs uppercase hover:bg-primary transition-colors">Book Now</a>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </section>
        `;

        const WhyChooseUs = () => `
            <section class="py-20 px-20 bg-white">
                <div class="max-w-7xl mx-auto grid grid-cols-3 gap-12">
                    ${state.whyChooseUs.map(w => `
                        <div class="text-center">
                            <i class="fa ${w.icon} text-4xl text-primary mb-6"></i>
                            <h4 class="text-xl font-bold mb-3">${w.title}</h4>
                            <p class="text-zinc-500">${w.desc}</p>
                        </div>
                    `).join('')}
                </div>
            </section>
        `;

        const Gallery = () => `
            <section id="gallery" class="py-24 px-20 bg-white">
                <div class="max-w-7xl mx-auto">
                    <h2 class="text-5xl font-serif text-dark text-center mb-16">Work Gallery</h2>
                    <div class="grid grid-cols-4 gap-4">
                        ${state.gallery.map(img => `
                            <div class="overflow-hidden rounded-2xl h-80">
                                <img src="${img}" class="w-full h-full object-cover hover:scale-110 transition-transform duration-500" />
                            </div>
                        `).join('')}
                    </div>
                </div>
            </section>
        `;

        const Reviews = () => {
            const avg = (state.reviews.reduce((a, b) => a + b.stars, 0) / state.reviews.length).toFixed(1);
            return `
            <section id="reviews" class="py-24 px-20 bg-secondary/30">
                <div class="max-w-7xl mx-auto">
                    <div class="grid grid-cols-3 gap-16">
                        <div>
                            <h2 class="text-5xl font-serif text-dark mb-6">Customer Stories</h2>
                            <div class="flex items-center gap-4 mb-8">
                                <span class="text-6xl font-bold text-dark">${avg}</span>
                                <div>
                                    <div class="flex text-pink-400 gap-1 text-xl">
                                        <i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i>
                                    </div>
                                    <div class="text-sm text-zinc-500">Overall Rating</div>
                                </div>
                            </div>
                            <!-- Star Breakdown Graph -->
                            <div class="space-y-3 mb-10">
                                ${[5,4,3,2,1].map(num => `
                                    <div class="flex items-center gap-4">
                                        <span class="text-xs font-bold w-4">${num}</span>
                                        <div class="h-2 flex-1 bg-zinc-200 rounded-full overflow-hidden">
                                            <div class="h-full bg-primary" style="width: ${state.reviews.filter(r=>r.stars===num).length / state.reviews.length * 100}%"></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <button onclick="document.getElementById('reviewModal').classList.remove('hidden')" class="w-full py-4 bg-white border-2 border-primary text-primary font-bold rounded-2xl hover:bg-primary hover:text-white transition-all">Write A Review</button>
                        </div>
                        <div class="col-span-2">
                            <div class="grid grid-cols-2 gap-6" id="review-container">
                                ${state.reviews.slice(0, reviewsToShow).map(r => `
                                    <div class="bg-white p-8 rounded-3xl shadow-sm border border-pink-50 fade-in">
                                        <div class="flex items-center gap-4 mb-4">
                                            <div class="w-12 h-12 rounded-full bg-pink-100 flex items-center justify-center text-primary font-bold">${r.avatar}</div>
                                            <div>
                                                <div class="font-bold">${r.name}</div>
                                                <div class="flex text-pink-400 text-xs gap-1">
                                                    ${Array(r.stars).fill('<i class="fa fa-star"></i>').join('')}
                                                </div>
                                            </div>
                                        </div>
                                        <p class="text-zinc-600 italic">"${r.comment}"</p>
                                    </div>
                                `).join('')}
                            </div>
                            ${state.reviews.length > reviewsToShow ? `
                                <div class="text-center mt-10">
                                    <button onclick="loadMoreReviews()" class="px-8 py-3 bg-zinc-900 text-white rounded-full font-bold hover:bg-primary transition-all">Load More Reviews</button>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            </section>
        `};

        const Contact = () => `
            <section id="contact" class="py-24 px-20 bg-white">
                <div class="max-w-7xl mx-auto grid grid-cols-2 gap-16">
                    <div>
                        <h2 class="text-4xl font-serif text-dark mb-10">Opening Hours & Contact</h2>
                        <div class="space-y-6 mb-12">
                            <div class="flex justify-between border-b border-zinc-100 pb-4"><span>Monday – Friday</span><span class="font-bold">${state.openHours.weekdays}</span></div>
                            <div class="flex justify-between border-b border-zinc-100 pb-4"><span>Saturday</span><span class="font-bold">${state.openHours.saturday}</span></div>
                            <div class="flex justify-between border-b border-zinc-100 pb-4 text-primary"><span>Sunday</span><span class="font-bold">${state.openHours.sunday}</span></div>
                        </div>
                        <div class="grid grid-cols-2 gap-8">
                            <div>
                                <i class="fa fa-phone text-primary mb-3 text-xl"></i>
                                <div class="font-bold">Call Us</div>
                                <div class="text-zinc-500">${state.config.phone}</div>
                            </div>
                            <div>
                                <i class="fa fa-location-dot text-primary mb-3 text-xl"></i>
                                <div class="font-bold">Address</div>
                                <div class="text-zinc-500">${state.config.address}</div>
                            </div>
                        </div>
                    </div>
                    <div class="rounded-3xl overflow-hidden shadow-2xl h-[450px]">
                        <iframe src="${state.config.mapEmbed}" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                    </div>
                </div>
            </section>
        `;

        const Footer = () => `
            <footer class="bg-zinc-900 text-zinc-400 py-20 px-20">
                <div class="max-w-7xl mx-auto grid grid-cols-4 gap-12">
                    <div class="col-span-1">
                        <div class="text-2xl font-serif font-bold text-white mb-6">${state.config.logo}</div>
                        <p class="text-sm leading-relaxed mb-6">Experience the art of beauty with our professional salon services. We specialize in bridal, hair, and skin treatments.</p>
                        <div class="flex gap-4">
                            <a href="#" class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center hover:text-primary transition-all"><i class="fab fa-instagram"></i></a>
                            <a href="#" class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center hover:text-primary transition-all"><i class="fab fa-facebook"></i></a>
                        </div>
                    </div>
                    <div>
                        <h4 class="text-white font-bold mb-6">Quick Links</h4>
                        <ul class="space-y-4 text-sm">
                            <li><a href="#about" class="hover:text-primary transition-colors">About Us</a></li>
                            <li><a href="#services" class="hover:text-primary transition-colors">Services</a></li>
                            <li><a href="#gallery" class="hover:text-primary transition-colors">Gallery</a></li>
                            <li><a href="#reviews" class="hover:text-primary transition-colors">Reviews</a></li>
                        </ul>
                    </div>
                    <div>
                        <h4 class="text-white font-bold mb-6">Contact Info</h4>
                        <p class="text-sm mb-4"><i class="fa fa-envelope mr-2"></i> contact@${state.config.logo.toLowerCase().replace(' ','')}.com</p>
                        <p class="text-sm"><i class="fa fa-phone mr-2"></i> ${state.config.phone}</p>
                    </div>
                    <div>
                        <h4 class="text-white font-bold mb-6">Newsletter</h4>
                        <div class="flex bg-zinc-800 rounded-xl p-2">
                            <input type="text" placeholder="Your Email" class="bg-transparent border-none outline-none px-4 flex-1 text-xs">
                            <button class="bg-primary text-white p-3 rounded-xl"><i class="fa fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
                <div class="mt-20 pt-8 border-t border-zinc-800 text-center text-xs">
                    &copy; ${new Date().getFullYear()} ${state.config.name}. All Rights Reserved.
                </div>
            </footer>
        `;

        // --- ADMIN PANELS ---
        const AdminPanel = () => {
            if (!isAdmin) return '';
            return `
                <div class="fixed inset-0 z-[200] bg-white flex">
                    <div class="w-72 bg-zinc-50 border-r border-zinc-200 p-8 flex flex-col">
                        <div class="text-2xl font-serif font-bold text-primary mb-12">ADMIN PANEL</div>
                        <nav class="space-y-2 flex-1">
                            ${['dashboard', 'config', 'hero', 'about', 'services', 'gallery', 'builder', 'hours'].map(tab => `
                                <button onclick="setTab('${tab}')" class="w-full text-left px-5 py-4 rounded-2xl flex items-center gap-3 transition-all ${activeAdminTab === tab ? 'admin-sidebar-active' : 'text-zinc-500 hover:bg-zinc-100'}">
                                    <span class="capitalize font-bold">${tab}</span>
                                </button>
                            `).join('')}
                        </nav>
                        <button onclick="logoutAdmin()" class="py-4 bg-zinc-900 text-white rounded-2xl font-bold">Logout</button>
                    </div>
                    <div class="flex-1 overflow-y-auto p-16">
                        ${renderAdminContent()}
                    </div>
                </div>
            `;
        };

        function renderAdminContent() {
            switch(activeAdminTab) {
                case 'dashboard': return `<h2 class="text-4xl font-serif mb-8">Dashboard Overview</h2><div class="grid grid-cols-3 gap-6"><div class="p-10 bg-pink-50 rounded-3xl"><h3 class="text-6xl font-serif font-bold text-primary">${state.services.length}</h3><p class="uppercase font-bold text-zinc-400">Total Services</p></div><div class="p-10 bg-zinc-50 rounded-3xl"><h3 class="text-6xl font-serif font-bold text-dark">${state.reviews.length}</h3><p class="uppercase font-bold text-zinc-400">Client Reviews</p></div></div>`;
                case 'config': return `
                    <h2 class="text-4xl font-serif mb-8">Business Config</h2>
                    <div class="space-y-6">
                        <div><label class="block text-xs font-bold uppercase mb-2">Business Name</label><input type="text" value="${state.config.name}" onchange="updateState('config', 'name', this.value)" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
                        <div><label class="block text-xs font-bold uppercase mb-2">WhatsApp (with country code)</label><input type="text" value="${state.config.whatsapp}" onchange="updateState('config', 'whatsapp', this.value)" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
                        <div><label class="block text-xs font-bold uppercase mb-2">Address</label><textarea onchange="updateState('config', 'address', this.value)" class="w-full p-4 bg-zinc-50 rounded-xl">${state.config.address}</textarea></div>
                    </div>
                `;
                case 'hero': return `
                    <h2 class="text-4xl font-serif mb-8">Hero Section</h2>
                    <div class="space-y-6">
                        <div><label class="block text-xs font-bold uppercase mb-2">Title</label><input type="text" value="${state.hero.title}" onchange="updateState('hero', 'title', this.value)" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
                        <div><label class="block text-xs font-bold uppercase mb-2">Subtitle</label><textarea onchange="updateState('hero', 'subtitle', this.value)" class="w-full p-4 bg-zinc-50 rounded-xl">${state.hero.subtitle}</textarea></div>
                        <div><label class="block text-xs font-bold uppercase mb-2">Image</label><input type="file" onchange="uploadImg(this, (url) => { state.hero.image = url; saveData(); render(); })" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
                    </div>
                `;
                case 'about': return `
                    <h2 class="text-4xl font-serif mb-8">About Section</h2>
                    <div class="space-y-6">
                        <div><label class="block text-xs font-bold uppercase mb-2">Title</label><input type="text" value="${state.about.title}" onchange="updateState('about', 'title', this.value)" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
                        <div><label class="block text-xs font-bold uppercase mb-2">Content</label><textarea onchange="updateState('about', 'content', this.value)" class="w-full p-4 bg-zinc-50 rounded-xl" rows="6">${state.about.content}</textarea></div>
                        <div><label class="block text-xs font-bold uppercase mb-2">Image</label><input type="file" onchange="uploadImg(this, (url) => { state.about.image = url; saveData(); render(); })" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
                    </div>
                `;
                case 'services': return `
                    <h2 class="text-4xl font-serif mb-8">Manage Services</h2>
                    <div class="grid grid-cols-2 gap-4 mb-8">${state.services.map((s,i) => `<div class="p-4 bg-zinc-50 rounded-xl flex justify-between"><span>${s.name}</span><button onclick="deleteItem('services', ${i})" class="text-red-500"><i class="fa fa-trash"></i></button></div>`).join('')}</div>
                    <div class="p-8 bg-pink-50 rounded-3xl"><h3 class="font-bold mb-4">Add New</h3><div class="grid grid-cols-2 gap-4"><input id="s_n" placeholder="Name" class="p-4 rounded-xl"><input id="s_p" placeholder="Price" class="p-4 rounded-xl"><button onclick="addService()" class="col-span-2 bg-primary text-white py-4 rounded-xl font-bold">Add Service</button></div></div>
                `;
                case 'gallery': return `
                    <h2 class="text-4xl font-serif mb-8">Manage Gallery</h2>
                    <div class="grid grid-cols-5 gap-4 mb-8">${state.gallery.map((g,i) => `<div class="relative group h-32"><img src="${g}" class="w-full h-full object-cover rounded-xl"><button onclick="deleteItem('gallery', ${i})" class="absolute top-2 right-2 bg-white p-1 rounded-full text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><i class="fa fa-times"></i></button></div>`).join('')}</div>
                    <input type="file" onchange="uploadImg(this, (url) => { state.gallery.push(url); saveData(); render(); })" class="p-4 bg-zinc-50 rounded-xl w-full">
                `;
                // Opening Hours এডিট করার জন্য
case 'hours': return `
    <h2 class="text-4xl font-serif mb-8">Opening Hours</h2>
    <div class="space-y-6">
        <div><label class="block text-xs font-bold uppercase mb-2">Weekdays</label>
        <input type="text" value="${state.openHours.weekdays}" onchange="state.openHours.weekdays = this.value; saveData();" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
        <div><label class="block text-xs font-bold uppercase mb-2">Saturday</label>
        <input type="text" value="${state.openHours.saturday}" onchange="state.openHours.saturday = this.value; saveData();" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
        <div><label class="block text-xs font-bold uppercase mb-2">Sunday</label>
        <input type="text" value="${state.openHours.sunday}" onchange="state.openHours.sunday = this.value; saveData();" class="w-full p-4 bg-zinc-50 rounded-xl"></div>
    </div>
`;

// Builder সেকশন সচল করার জন্য
case 'builder': return `
    <h2 class="text-4xl font-serif mb-8">Page Builder</h2>
    <div class="space-y-4 mb-8">
        ${state.sections.map((s, i) => `
            <div class="p-4 bg-zinc-100 rounded-xl flex justify-between items-center">
                <span class="font-bold">${s.title}</span>
                <button onclick="state.sections.splice(${i},1); saveData(); render();" class="text-red-500">Delete</button>
            </div>
        `).join('')}
    </div>
    <div class="p-8 bg-zinc-50 rounded-3xl border">
        <h3 class="font-bold mb-4">Add Custom Text Section</h3>
        <input id="new_sec_t" placeholder="Section Title" class="w-full p-4 mb-4 rounded-xl border">
        <textarea id="new_sec_c" placeholder="Section Content" class="w-full p-4 mb-4 rounded-xl border" rows="4"></textarea>
        <button onclick="const t=document.getElementById('new_sec_t').value; const c=document.getElementById('new_sec_c').value; if(t&&c){ state.sections.push({title:t, content:c}); saveData(); render(); }" class="w-full py-4 bg-primary text-white rounded-xl font-bold">Add Section</button>
    </div>
`;
            }
        }

        // --- ACTIONS ---
        function render() {
            const app = document.getElementById('app');
            if (isAdmin) {
                app.innerHTML = AdminPanel();
            } else {
                app.innerHTML = `
                    ${Header()}
                    <main>
                        ${Hero()}
                        ${About()}
                        ${Services()}
                        ${WhyChooseUs()}
                        ${Gallery()}
                        ${state.sections.map(s => `<section class="py-24 px-20 bg-white border-t border-zinc-100"><div class="max-w-7xl mx-auto"><h2 class="text-5xl font-serif mb-6">${s.title}</h2><p class="text-lg text-zinc-600">${s.content}</p></div></section>`).join('')}
                        ${Reviews()}
                        ${Contact()}
                    </main>
                    ${Footer()}
                    <!-- Modals -->
                    <div id="loginModal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center">
                        <div class="bg-white p-10 rounded-3xl w-96 shadow-2xl">
                            <h3 class="text-3xl font-serif mb-8 text-center">Admin Access</h3>
                            <input id="adm_u" type="text" placeholder="Username" class="w-full p-4 mb-4 bg-zinc-50 rounded-xl border border-zinc-100 outline-none">
                            <input id="adm_p" type="password" placeholder="Password" class="w-full p-4 mb-8 bg-zinc-50 rounded-xl border border-zinc-100 outline-none">
                            <button onclick="handleLogin()" class="w-full py-4 bg-primary text-white rounded-xl font-bold">Login</button>
                            <button onclick="toggleAdminLogin()" class="w-full mt-4 text-zinc-400 text-sm">Cancel</button>
                        </div>
                    </div>
                    <div id="reviewModal" class="hidden fixed inset-0 z-[100] modal-bg flex items-center justify-center">
                        <div class="bg-white p-10 rounded-3xl w-[500px] shadow-2xl">
                            <h3 class="text-3xl font-serif mb-6">Write a Review</h3>
                            <input id="rv_n" type="text" placeholder="Your Name" class="w-full p-4 mb-4 bg-zinc-50 rounded-xl outline-none">
                            <select id="rv_s" class="w-full p-4 mb-4 bg-zinc-50 rounded-xl outline-none">
                                <option value="5">5 Stars</option><option value="4">4 Stars</option><option value="3">3 Stars</option><option value="2">2 Stars</option><option value="1">1 Star</option>
                            </select>
                            <textarea id="rv_c" placeholder="Comment" class="w-full p-4 mb-8 bg-zinc-50 rounded-xl outline-none" rows="4"></textarea>
                            <button onclick="submitReview()" class="w-full py-4 bg-primary text-white rounded-xl font-bold">Post Review</button>
                            <button onclick="document.getElementById('reviewModal').classList.add('hidden')" class="w-full mt-4 text-zinc-400 text-sm">Close</button>
                        </div>
                    </div>
                `;
            }
        }

        window.toggleAdminLogin = () => document.getElementById('loginModal').classList.toggle('hidden');
        window.handleLogin = () => {
            if (document.getElementById('adm_u').value === 'admin' && document.getElementById('adm_p').value === 'admin123@') {
                isAdmin = true; render();
            } else alert('Access Denied');
        };
        window.logoutAdmin = () => { isAdmin = false; render(); };
        window.setTab = (t) => { activeAdminTab = t; render(); };
        window.updateState = (sec, key, val) => { state[sec][key] = val; saveData(); };
        
        window.deleteItem = (sec, idx) => { state[sec].splice(idx, 1); saveData(); render(); };
        window.addService = () => {
            state.services.push({ id: Date.now(), name: document.getElementById('s_n').value, price: document.getElementById('s_p').value, desc: 'Quality Service', icon: 'fa-star' });
            saveData(); render();
        };

        window.uploadImg = (input, cb) => {
            const reader = new FileReader();
            reader.onload = (e) => cb(e.target.result);
            reader.readAsDataURL(input.files[0]);
        };

        window.loadMoreReviews = () => {
            reviewsToShow += 4;
            render();
        };

        window.submitReview = () => {
            const name = document.getElementById('rv_n').value;
            const stars = parseInt(document.getElementById('rv_s').value);
            const comment = document.getElementById('rv_c').value;
            if(name && comment) {
                state.reviews.unshift({ name, stars, comment, avatar: name[0].toUpperCase() });
                saveData();
                document.getElementById('reviewModal').classList.add('hidden');
                render();
            }
        };

        render();
    </script>
</body>
</html>
